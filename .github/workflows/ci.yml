# Build verification on a macOS runner.
# This exists because development happens partly from a Linux environment that
# cannot run Xcode — every push must prove the project still compiles.
name: build
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    # Pinned, not macos-latest: xcodegen >= 2.45 emits Xcode project format 77,
    # which requires Xcode 16+. macos-15's default Xcode is 16.4. macos-14
    # (Xcode 15.4) cannot read the generated project — learned the hard way
    # (run 29202857649, a false green).
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build (iOS Simulator)
        # pipefail is load-bearing: without it, `| tail` masks xcodebuild's
        # exit code and a failed build reports success. tee keeps the full log so
        # the next step can surface the real compile error (tail alone hid it once).
        run: |
          set -o pipefail
          xcodebuild build \
            -project Covariate.xcodeproj \
            -scheme Covariate \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee build.log | tail -100
      - name: Surface compile errors
        if: failure()
        run: |
          echo "=== error: lines from the full build log ==="
          grep -nE "error:" build.log | head -60 || echo "(no 'error:' lines captured)"
