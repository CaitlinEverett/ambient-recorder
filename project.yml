# XcodeGen project definition — the .xcodeproj is generated, never committed.
# Install: brew install xcodegen   Generate: xcodegen generate
name: Covariate
options:
  bundleIdPrefix: edu.gatech.team42
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Covariate:
    type: application
    platform: iOS
    sources: [Covariate]
    info:
      path: Covariate/Info.plist
      properties:
        UILaunchScreen: {}
        NSMotionUsageDescription: >-
          Covariate logs accelerometer, barometer, and magnetometer readings to
          record the ambient conditions around an experiment.
        NSMicrophoneUsageDescription: >-
          Covariate logs sound LEVEL only (a single loudness number). No audio
          is ever recorded or stored.
        NSCameraUsageDescription: >-
          Covariate reads the camera's brightness metadata to log ambient light.
          Video is recorded only if you turn on Reference Video, and never
          includes audio.
        NSLocationWhenInUseUsageDescription: >-
          Covariate records a coarse one-time location (region and altitude) at
          session start to contextualize barometer readings and site conditions.
          Precise coordinates are not stored.
        UIBackgroundModes: [audio]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: edu.gatech.team42.covariate
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
